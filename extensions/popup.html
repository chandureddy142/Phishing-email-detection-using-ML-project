<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PhishGuard AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>
<body>

    <!-- ── FIXED BACKGROUND ── -->
    <div class="bg-layer">
        <div class="world-map"></div>
        <div class="ambient-glow"></div>
        <!-- animated pulse dots -->
        <div class="pdot" style="left:15%;top:25%"></div>
        <div class="pdot" style="left:70%;top:60%"></div>
        <div class="pdot" style="left:45%;top:80%"></div>
    </div>

    <!-- ── SCANNING LASER (shown during analysis) ── -->
    <div id="laserBar" class="laser-bar hidden"></div>

    <!-- ── MAIN GLASS PANEL ── -->
    <div class="panel">

        <!-- Header -->
        <div class="pg-header">
            <div class="logo-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="shield-icon">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <polyline points="9 12 11 14 15 10"/>
                </svg>
            </div>
            <div class="logo-text">
                <span class="logo-main">PHISH<span class="logo-accent">GUARD</span></span>
                <span class="logo-sub">Neural Detector v1.0</span>
            </div>
            <div class="status-dot" id="statusDot" title="System Online"></div>
        </div>

        <!-- Tip -->
        <div class="tip-bar">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span>Highlight email text before scanning for best accuracy</span>
        </div>

        <!-- Scan Button -->
        <button id="scanBtn" class="scan-btn">
            <div class="scan-btn-shine"></div>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            <span id="btnText">EXECUTE SCAN</span>
        </button>

        <!-- Loading state -->
        <div id="loading" class="loading-box hidden">
            <div class="spinner-ring"></div>
            <div class="log-lines" id="logLines"></div>
        </div>

        <!-- Result card -->
        <div id="result" class="result-card hidden">
            <!-- filled by JS -->
        </div>

    </div>

    <!-- Footer strip -->
    <div class="pg-footer">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>All analysis runs locally · 127.0.0.1:5000</span>
    </div>

    <script src="popup.js"></script>
    <script>
        // Animate log lines during loading
        const logMessages = [
            'Extracting content vectors...',
            'Running neural classifier...',
            'Checking URL reputation...',
            'Finalizing verdict...'
        ];

        const origSetLoading = window.__setLoading;

        // Intercept loading to show log lines
        document.addEventListener('DOMContentLoaded', () => {
            const loading = document.getElementById('loading');
            const logLines = document.getElementById('logLines');
            const laserBar = document.getElementById('laserBar');
            const scanBtn = document.getElementById('scanBtn');
            const btnText = document.getElementById('btnText');

            // Patch scan button to also animate logs
            scanBtn.addEventListener('click', () => {
                logLines.innerHTML = '';
                laserBar.classList.remove('hidden');
                btnText.textContent = 'SCANNING...';
                let i = 0;
                const t = setInterval(() => {
                    if (i < logMessages.length) {
                        const line = document.createElement('div');
                        line.className = 'log-line';
                        line.textContent = logMessages[i++];
                        logLines.appendChild(line);
                        setTimeout(() => line.classList.add('visible'), 10);
                    } else {
                        clearInterval(t);
                    }
                }, 420);

                // Re-show button text when result appears
                const obs = new MutationObserver(() => {
                    const result = document.getElementById('result');
                    if (!result.classList.contains('hidden')) {
                        laserBar.classList.add('hidden');
                        btnText.textContent = 'EXECUTE SCAN';
                        obs.disconnect();
                    }
                });
                obs.observe(document.getElementById('result'), { attributes: true });
            }, true); // capture phase so it runs before popup.js
        });
    </script>
</body>
</html>
